<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1512">
<title>Stash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0d1512; --card:#15211c; --card2:#1c2b25; --line:#26382f;
  --txt:#eef5f0; --mut:#8fa59a; --acc:#7ee2a8; --acc-ink:#062414;
  --red:#ff8a7a; --amb:#f3c969; --blue:#8ec5ff;
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.35}
body{min-height:100dvh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{max-width:560px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 0}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font-size:19px;font-weight:700;margin:0;min-width:150px;text-align:center;text-transform:capitalize}
.month h1 small{display:block;font-size:11.5px;font-weight:600;color:var(--mut);text-transform:none;margin-top:1px}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--mut)}
.ib:active{background:var(--card2)}
.ib svg{width:22px;height:22px}
.ib[disabled]{opacity:.25}

/* cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:radial-gradient(120% 140% at 100% 0%,#1f4a36 0%,#15211c 55%);padding:20px 18px 16px}
.lbl{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.big{font-size:42px;font-weight:800;letter-spacing:-.02em;margin:4px 0 12px}
.big.neg{color:var(--red)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #ffffff14;padding-top:12px}
.trio div span{display:block;font-size:11.5px;color:var(--mut)}
.trio div b{font-size:15px;font-weight:700}
.pos{color:var(--acc)} .neg{color:var(--red)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo .card{margin-bottom:12px;padding:14px}
.duo b{display:block;font-size:20px;font-weight:800;margin:2px 0 1px}
.duo small{color:var(--mut);font-size:12.5px}
.bar{height:8px;border-radius:99px;background:#ffffff12;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--acc);transition:width .35s}
.bar i.over{background:var(--red)} .bar i.warn{background:var(--amb)} .bar i.rev{background:var(--blue)}

h2{font-size:14px;font-weight:700;margin:20px 4px 8px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;
  display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:600;text-transform:none;letter-spacing:0}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--card2)}
.row .g{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--mut)}
.row .a{font-weight:700;text-align:right;white-space:nowrap}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:800;font-size:15px;
  background:var(--card2);color:var(--acc)}
.dot.rev{color:var(--blue)} .dot.done{background:var(--acc);color:var(--acc-ink)}
.dot.done.rev{background:var(--blue)}
.pill{flex:none;padding:8px 13px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--acc)}
.pill.rev{color:var(--blue)}
.pill:active{transform:scale(.96)}
.empty{padding:26px 16px;text-align:center;color:var(--mut);font-size:14.5px}
.day{font-size:12.5px;color:var(--mut);font-weight:700;margin:16px 4px 6px;text-transform:capitalize}

/* navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:#0d1512f0;backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center}
nav button.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--mut);padding:6px 0}
nav button.tab svg{width:23px;height:23px}
nav button.tab.on{color:var(--acc)}
.fab{width:60px;height:60px;border-radius:22px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin:-22px auto 0;
  box-shadow:0 8px 24px #7ee2a840}
.fab:active{transform:scale(.94)}
.fab svg{width:28px;height:28px}

/* panneau */
#veil{position:fixed;inset:0;background:#000a;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  max-width:560px;margin:0 auto;max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
  padding:10px 18px calc(20px + env(safe-area-inset-bottom))}
#sheet.on{transform:none}
.grip{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh h3{margin:0;font-size:19px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
.amt{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:6px 0 14px}
.amt input{width:100%;max-width:230px;background:none;border:0;outline:0;text-align:center;font-size:46px;font-weight:800;letter-spacing:-.02em}
.amt span{font-size:30px;font-weight:700;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{padding:9px 14px;border-radius:99px;background:var(--bg);border:1px solid var(--line);font-size:14.5px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip.on.rev{background:var(--blue);border-color:var(--blue)}
.chip.on.ep{background:var(--amb);border-color:var(--amb)}
.dot.ep{color:var(--amb)} .dot.done.ep{background:var(--amb);color:var(--acc-ink)} .pill.ep{color:var(--amb)} .amb{color:var(--amb)}
label.f{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:0 2px 5px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:0;margin-bottom:12px;color-scheme:dark}
.in:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:800;background:var(--acc);color:var(--acc-ink);margin-top:4px}
.btn.ghost{background:var(--bg);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid #ff8a7a55}
.btn:active{transform:scale(.985)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13.5px;color:var(--mut);margin:0 2px 12px}
.chk{display:flex;align-items:center;gap:10px;margin:2px 2px 14px;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.err{color:var(--red);font-size:13.5px;margin:-4px 2px 10px;min-height:1em}

/* graphique */
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.chart .bars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.chart .bars i{width:42%;max-width:16px;border-radius:5px 5px 2px 2px;min-height:2px}
.chart .bars i.r{background:var(--blue)} .chart .bars i.d{background:var(--acc)}
.chart .c span{font-size:11px;color:var(--mut);text-transform:capitalize}
.chart .c.cur span{color:var(--txt);font-weight:700}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--mut);margin-top:10px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--txt);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.welcome{padding:8vh 6px 0;text-align:center}
.welcome .logo{width:84px;height:84px;border-radius:26px;margin:0 auto 18px;display:block}
.welcome h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.welcome p{color:var(--mut);margin:0 0 26px}
.welcome .card{text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" hidden><div class="in">
  <button class="tab" data-tab="mois"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Mois</button>
  <button class="tab" data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Opérations</button>
  <button class="fab" data-act="add" aria-label="Ajouter une opération"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tab" data-tab="bilan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Bilan</button>
  <button class="tab" data-tab="regl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h3M11 12h9M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Réglages</button>
</div></nav>
<div id="veil"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script src="app.js"></script>
</body>
</html>
